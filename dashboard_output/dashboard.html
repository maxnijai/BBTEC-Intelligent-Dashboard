const KPI=({label,value,sub,color})=>(<div style={{background:X.s1,border:`1px solid ${X.bd}`,borderRadius:8,padding:"14px 16px",position:"relative",overflow:"hidden"}}><div style={{position:"absolute",top:0,left:0,right:0,height:3,background:color}}/><div style={{fontSize:10,color:X.mu,textTransform:"uppercase",letterSpacing:1,fontWeight:600,marginBottom:4}}>{label}</div><div style={{fontFamily:"'Inter',sans-serif",fontSize:24,fontWeight:800,color,margin:"2px 0",letterSpacing:"-0.5px"}}>{value}</div>{sub&&<div style={{fontSize:11,color:X.mu,marginTop:2}}>{sub}</div>}</div>);

const LN=15.2,LX=20.8,ON=97.0,OX=102.0;
const lm=l=>Math.log(Math.tan(Math.PI/4+(l*Math.PI/180)/2));
const mN=lm(LN),mX=lm(LX),W=800,H=600;
const tX=o=>((o-ON)/(OX-ON))*W;
const tY=l=>(1-(lm(l)-mN)/(mX-mN))*H;
const PV=[{n:"เชียงราย",p:[[99.5,20.4],[100.8,20.3],[100.9,19.6],[100.1,19.3],[99.3,19.5],[99.0,20.0]]},{n:"เชียงใหม่",p:[[98.0,19.8],[99.0,20.0],[99.3,19.5],[99.5,19.0],[99.4,18.3],[98.8,18.1],[98.0,18.3],[97.8,19.0]]},{n:"แม่ฮ่องสอน",p:[[97.4,19.8],[98.0,19.8],[97.8,19.0],[98.0,18.3],[97.8,17.8],[97.4,17.6],[97.2,18.5]]},{n:"ลำพูน",p:[[98.8,18.1],[99.4,18.3],[99.3,18.0],[99.0,17.8]]},{n:"ลำปาง",p:[[99.3,19.5],[100.1,19.3],[100.2,18.8],[100.0,18.2],[99.3,18.0],[99.4,18.3],[99.5,19.0]]},{n:"พะเยา",p:[[100.1,19.3],[100.8,19.5],[100.6,19.0],[100.2,18.8]]},{n:"น่าน",p:[[100.8,19.5],[100.8,20.3],[101.4,19.8],[101.3,18.8],[100.8,18.5],[100.6,19.0]]},{n:"แพร่",p:[[100.0,18.2],[100.2,18.8],[100.6,19.0],[100.8,18.5],[100.5,17.9],[100.0,18.0]]},{n:"อุตรดิตถ์",p:[[100.5,17.9],[100.8,18.5],[101.3,18.8],[101.2,17.8],[100.8,17.4],[100.5,17.5]]},{n:"ตาก",p:[[97.8,17.8],[98.8,18.1],[99.0,17.8],[99.3,17.2],[99.5,16.5],[99.2,15.8],[98.5,15.6],[97.9,16.0],[97.5,16.8]]},{n:"สุโขทัย",p:[[99.3,17.2],[100.0,17.4],[100.2,17.0],[99.8,16.8],[99.5,16.5]]},{n:"พิษณุโลก",p:[[100.0,17.4],[100.5,17.5],[100.8,17.4],[101.0,17.0],[100.8,16.5],[100.2,16.5],[100.2,17.0]]},{n:"กำแพงเพชร",p:[[99.2,15.8],[99.5,16.5],[99.8,16.8],[100.2,16.5],[100.0,15.8],[99.5,15.5]]},{n:"พิจิตร",p:[[100.2,16.5],[100.8,16.5],[100.6,16.0],[100.2,15.8],[100.0,15.8]]},{n:"เพชรบูรณ์",p:[[100.8,17.4],[101.2,17.8],[101.5,17.0],[101.7,16.5],[101.3,16.0],[100.8,16.0],[100.8,16.5],[101.0,17.0]]}];
const pp=pts=>pts.map((p,i)=>`${i===0?"M":"L"}${tX(p[0])},${tY(p[1])}`).join(" ")+"Z";
const cn=pts=>[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length];

const TMap=({coords,districts,onDotClick})=>{
  const[hov,setHov]=useState(null);
  const[vb,setVb]=useState({x:0,y:0,w:W,h:H});
  const[drag,setDrag]=useState(null);
  if(!coords||!coords.length) return <div style={{color:X.mu,padding:20}}>No coordinates</div>;
  const dists=(districts||[]).filter(d=>d.lat&&d.lon&&d.name!=="ไม่ระบุ");
  const zoom=(factor)=>{
    setVb(v=>{
      const nw=Math.max(100,Math.min(W,v.w*factor));
      const nh=Math.max(75,Math.min(H,v.h*factor));
      const cx=v.x+v.w/2, cy=v.y+v.h/2;
      return{x:Math.max(0,Math.min(W-nw,cx-nw/2)),y:Math.max(0,Math.min(H-nh,cy-nh/2)),w:nw,h:nh};
    });
  };
  const reset=()=>setVb({x:0,y:0,w:W,h:H});
  const onWheel=(e)=>{e.preventDefault();zoom(e.deltaY>0?1.2:0.83);};
  const onMD=(e)=>{if(e.button===0){const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const sp=pt.matrixTransform(svg.getScreenCTM().inverse());setDrag({sx:sp.x,sy:sp.y,ox:vb.x,oy:vb.y});}};
  const onMM=(e)=>{if(drag){const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const sp=pt.matrixTransform(svg.getScreenCTM().inverse());const dx=sp.x-drag.sx,dy=sp.y-drag.sy;setVb(v=>({...v,x:Math.max(0,Math.min(W-v.w,drag.ox-dx)),y:Math.max(0,Math.min(H-v.h,drag.oy-dy))}));}};
  const onMU=()=>setDrag(null);
  const zoomLevel=Math.round((W/vb.w)*100);
  const sc=W/vb.w;
  return(<div style={{position:"relative"}}>
    <svg viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} style={{width:"100%",height:420,background:X.mapBg,borderRadius:8,cursor:drag?"grabbing":"grab"}} onWheel={onWheel} onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}>
      {PV.map((p,i)=><path key={i} d={pp(p.p)} fill={`hsl(${140+i*3},25%,${18+i}%)`} stroke="#4a7a44" strokeWidth={0.8/sc} opacity={0.85}/>)}
      {PV.map((p,i)=>{const c=cn(p.p);return <text key={`l${i}`} x={tX(c[0])} y={tY(c[1])} textAnchor="middle" fill={sc>1.3?"rgba(255,255,255,0.5)":"rgba(255,255,255,0.25)"} fontSize={sc>1.5?6/sc*1.5:7/sc}>{p.n}</text>;})}
      {coords.map((c,i)=>(<circle key={`h${i}`} cx={tX(c.lon)} cy={tY(c.lat)} r={14/sc} fill={afC(c.af)} opacity={0.1}/>))}
      {coords.map((c,i)=>(<circle key={i} cx={tX(c.lon)} cy={tY(c.lat)} r={hov===i?7/sc:Math.max(2,3.5/sc)} fill={afC(c.af)} stroke="rgba(255,255,255,0.4)" strokeWidth={hov===i?2/sc:0.3/sc} style={{cursor:"pointer"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)} onClick={(e)=>{e.stopPropagation();onDotClick&&onDotClick(c);}}/>))}
      {dists.map((d,i)=>{const r=Math.max(8,Math.min(20,d.count*1.5))/sc;return(<g key={`d${i}`}><circle cx={tX(d.lon)} cy={tY(d.lat)} r={r} fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth={1/sc} strokeDasharray={`${3/sc},${2/sc}`}/>{sc>1.5&&<text x={tX(d.lon)} y={tY(d.lat)+r+8/sc} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize={6/sc}>{d.name}({d.count})</text>}</g>);})}
    </svg>
    {/* Zoom controls */}
    <div style={{position:"absolute",top:8,left:8,display:"flex",flexDirection:"column",gap:3}}>
      <button onClick={()=>zoom(0.7)} style={{width:28,height:28,borderRadius:6,border:`1px solid ${X.bd}`,background:X.s1,color:X.tx,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      <button onClick={()=>zoom(1.4)} style={{width:28,height:28,borderRadius:6,border:`1px solid ${X.bd}`,background:X.s1,color:X.tx,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
      <button onClick={reset} style={{width:28,height:28,borderRadius:6,border:`1px solid ${X.bd}`,background:X.s1,color:X.mu,cursor:"pointer",fontSize:9,display:"flex",alignItems:"center",justifyContent:"center"}}>⟳</button>
      <div style={{textAlign:"center",fontSize:8,color:X.mu,fontFamily:"monospace"}}>{zoomLevel}%</div>
    </div>
    {hov!==null&&coords[hov]&&(<div style={{position:"absolute",bottom:8,left:"50%",transform:"translateX(-50%)",background:`${X.s1}f0`,border:`1px solid ${X.bd}`,borderRadius:8,padding:"6px 12px",fontSize:11,whiteSpace:"nowrap",pointerEvents:"none",zIndex:5}}>
      <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:afC(coords[hov].af),marginRight:6,verticalAlign:"middle"}}/>
      {coords[hov].sowner} | {coords[hov].sev} | {coords[hov].district||coords[hov].prov||"N/A"} | {coords[hov].aging}d
    </div>)}
  </div>);
};

// Leaflet Map (OpenStreetMap)
const LMap=({coords,districts,onDotClick})=>{
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const markersRef=useRef([]);
  

  useEffect(()=>{
    if(!mapRef.current||mapInst.current) return;
    // Load Leaflet CSS
    if(!document.getElementById("leaflet-css")){
      const link=document.createElement("link");
      link.id="leaflet-css";link.rel="stylesheet";
      link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
      document.head.appendChild(link);
    }
    // Load Leaflet JS
    const loadLeaflet=()=>{
      if(window.L) return initMap();
      const sc=document.createElement("script");
      sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      sc.onload=initMap;
      document.head.appendChild(sc);
    };
    const initMap=()=>{
      const L=window.L;
      const map=L.map(mapRef.current,{zoomControl:true}).setView([18.0,99.5],7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        attribution:'&copy; OpenStreetMap',maxZoom:18,opacity:0.9
      }).addTo(map);
      mapInst.current=map;
      
      // Ticket dots
      (coords||[]).forEach(c=>{
        const color=afC(c.af);
        const marker=L.circleMarker([c.lat,c.lon],{radius:6,fillColor:color,color:"white",weight:1,fillOpacity:0.85}).addTo(map);
        marker.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6"><b>${c.sowner}</b><br/>${c.sev} | ${c.district||c.prov||"N/A"}<br/>Aging: <b>${c.aging}d</b><br/>Problem: ${c.problem}<br/>Root: ${c.root}${c.subimpact>0?"<br/>Subimpact: "+c.subimpact:""}</div>`,{maxWidth:250});
        marker.on("click",()=>{if(onDotClick)onDotClick(c);});
        markersRef.current.push(marker);
      });
      
      // District labels
      (districts||[]).filter(d=>d.lat&&d.lon&&d.name!=="ไม่ระบุ").forEach(d=>{
        L.circleMarker([d.lat,d.lon],{radius:Math.max(4,Math.min(14,d.count/3)),fillColor:"transparent",color:"white",weight:1,dashArray:"3,2",fillOpacity:0}).addTo(map).bindTooltip(`${d.name} (${d.count} tickets)`,{permanent:false,direction:"top",className:"dist-label"});
      });
      
      setTimeout(()=>map.invalidateSize(),200);
    };
    loadLeaflet();
    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;markersRef.current=[];}};
  },[]);
  
  if(!coords||!coords.length) return <div style={{color:X.mu,padding:20}}>No coordinates</div>;
  return(<div>
    <div ref={mapRef} style={{width:"100%",height:420,borderRadius:8,overflow:"hidden",border:`1px solid ${X.bd}`}}/>
  </div>);
};

// Cluster Leaflet Map
const CLMap=({cluster,tickets,onDotClick})=>{
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const cl=cluster;
  useEffect(()=>{
    if(!mapRef.current||!cl) return;
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    const loadL=()=>{
      if(window.L) return init();
      if(!document.getElementById("leaflet-css")){const lk=document.createElement("link");lk.id="leaflet-css";lk.rel="stylesheet";lk.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(lk);}
      const sc=document.createElement("script");sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";sc.onload=init;document.head.appendChild(sc);
    };
    const init=()=>{
      const L=window.L;
      const map=L.map(mapRef.current,{zoomControl:true,scrollWheelZoom:true}).setView([cl.lat,cl.lon],13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19,opacity:0.9}).addTo(map);
      mapInst.current=map;
      L.circle([cl.lat,cl.lon],{radius:5000,color:"#4a7bbd",weight:2,dashArray:"8,4",fillColor:"#4a7bbd",fillOpacity:0.06}).addTo(map).bindTooltip("รัศมี 5 กม.",{direction:"top"});
      L.circleMarker([cl.lat,cl.lon],{radius:5,fillColor:"#d44040",color:"white",weight:2,fillOpacity:1}).addTo(map).bindTooltip("ศูนย์กลาง Cluster",{direction:"top"});
      const hav=(la1,lo1,la2,lo2)=>{const R=6371,dLat=(la2-la1)*Math.PI/180,dLon=(lo2-lo1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));};
      (tickets||[]).forEach(t=>{
        const dist=hav(cl.lat,cl.lon,t.lat,t.lon).toFixed(2);
        const color=afC(t.af);
        const m=L.circleMarker([t.lat,t.lon],{radius:7,fillColor:color,color:"white",weight:1.5,fillOpacity:0.9}).addTo(map);
        m.bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6"><b>${t.tid}</b> | ${t.sev} | ${t.aging}d<br/><b>${t.site}</b><br/>${t.subj||""}<br/>📋 ${t.cls||"-"}<br/>📍 ห่างศูนย์กลาง <b>${dist} km</b></div>`,{maxWidth:280});
        m.on("click",()=>{if(onDotClick)onDotClick(t);});
      });
      setTimeout(()=>map.invalidateSize(),200);
    };
    loadL();
    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[cl]);
  return(<div ref={mapRef} style={{width:"100%",height:320,borderRadius:8,overflow:"hidden",border:`1px solid ${X.bd}`}}/>);
};

const ClusterMapWrapper=({cluster,tickets,onDotClick,cvb,setCvb,cdrag,setCdrag})=>{
  const[cmode,setCmode]=useState("svg");
  const cl=cluster;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
      <div style={{fontSize:10,fontWeight:600,color:X.mu}}>แผนที่ไซต์ในรัศมี 5 กม.</div>
      <div style={{display:"flex",gap:3}}>
        <button onClick={()=>setCmode("svg")} style={{fontSize:9,padding:"3px 8px",borderRadius:4,border:`1px solid ${cmode==="svg"?X.b:X.bd}`,background:cmode==="svg"?`${X.b}15`:X.s2,color:cmode==="svg"?X.b:X.mu,cursor:"pointer"}}>🗺️ SVG</button>
        <button onClick={()=>setCmode("leaflet")} style={{fontSize:9,padding:"3px 8px",borderRadius:4,border:`1px solid ${cmode==="leaflet"?X.gn:X.bd}`,background:cmode==="leaflet"?`${X.gn}15`:X.s2,color:cmode==="leaflet"?X.gn:X.mu,cursor:"pointer"}}>🌍 OSM</button>

      const cx=tX(cl.lon),cy=tY(cl.lat);
      const defVb={x:cx-80,y:cy-60,w:160,h:120};
      const vb2=cvb||defVb;
      const csc=160/vb2.w;
      const cZoom=(f)=>{const v=cvb||defVb;const nw=Math.max(20,Math.min(300,v.w*f)),nh=Math.max(15,Math.min(225,v.h*f));const mx=v.x+v.w/2,my=v.y+v.h/2;setCvb({x:mx-nw/2,y:my-nh/2,w:nw,h:nh});};

          onWheel={e=>{e.preventDefault();cZoom(e.deltaY>0?1.3:0.77);}}
          onMouseDown={e=>{const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const sp=pt.matrixTransform(svg.getScreenCTM().inverse());const v=cvb||defVb;setCdrag({sx:sp.x,sy:sp.y,ox:v.x,oy:v.y});}}
          onMouseMove={e=>{if(cdrag){const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const sp=pt.matrixTransform(svg.getScreenCTM().inverse());setCvb(v=>({...(v||defVb),x:cdrag.ox-(sp.x-cdrag.sx),y:cdrag.oy-(sp.y-cdrag.sy)}));}}}
          onMouseUp={()=>setCdrag(null)} onMouseLeave={()=>setCdrag(null)}>
          {PV.map((p,i)=><path key={i} d={pp(p.p)} fill={`hsl(${140+i*3},25%,${70+i}%)`} stroke={X.bd} strokeWidth={0.5/csc} opacity={0.5}/>)}
          <circle cx={cx} cy={cy} r={18/csc} fill="none" stroke={X.b} strokeWidth={1/csc} strokeDasharray={`${4/csc},${2/csc}`} opacity={0.6}/>
          <circle cx={cx} cy={cy} r={18/csc} fill={`${X.b}10`}/>
          {(cl.tkt||[]).map((t,i)=>(<g key={i}>
            <circle cx={tX(t.lon)} cy={tY(t.lat)} r={Math.max(2,4/csc)} fill={afC(t.af)} stroke="white" strokeWidth={0.8/csc}/>
            {csc>0.8&&<text x={tX(t.lon)+5/csc} y={tY(t.lat)+1.5/csc} fill={X.tx} fontSize={Math.max(1.5,3/csc)} fontFamily="monospace">{t.site.slice(0,12)}</text>}
          </g>))}
          <circle cx={cx} cy={cy} r={2/csc} fill={X.rd} stroke="white" strokeWidth={0.5/csc}/>
          {csc<1.5&&<text x={cx} y={cy-6/csc} textAnchor="middle" fill={X.b} fontSize={3/csc} fontWeight={700}>ศูนย์กลาง</text>}
        </svg>
        <div style={{position:"absolute",top:6,left:6,display:"flex",flexDirection:"column",gap:2}}>
          <button onClick={()=>cZoom(0.65)} style={{width:24,height:24,borderRadius:4,border:`1px solid ${X.bd}`,background:X.s1,color:X.tx,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
          <button onClick={()=>cZoom(1.5)} style={{width:24,height:24,borderRadius:4,border:`1px solid ${X.bd}`,background:X.s1,color:X.tx,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
          <button onClick={()=>setCvb(null)} style={{width:24,height:24,borderRadius:4,border:`1px solid ${X.bd}`,background:X.s1,color:X.mu,cursor:"pointer",fontSize:9,display:"flex",alignItems:"center",justifyContent:"center"}}>⟳</button>
        </div>
      </div>);
    })()}
    <div style={{display:"flex",gap:8,marginTop:6,fontSize:9,color:X.mu}}>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:"50%",border:`1.5px dashed ${X.b}`}}/> รัศมี 5 กม.</span>
      <span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:6,height:6,borderRadius:"50%",background:X.rd}}/> ศูนย์กลาง</span>
      <AfLeg/>
    </div>
  </div>);
};

    if(!hasFilter) return d.tickets||[];
    return (d.tickets||[]).filter(t=>{
      if(fOwner!=="all"&&t.sowner!==fOwner) return false;
      if(fReg!=="all"&&t.reg!==fReg) return false;
      if(fAF!=="all"&&t.af!==fAF) return false;
      if(fSev!=="all"&&t.sev!==fSev) return false;
      if(fPri!=="all"&&String(t.pri)!==fPri) return false;
      return true;
    });
  },[d,fOwner,fReg,fAF,fSev,hasFilter]);

  const filteredCoords=useMemo(()=>{
    if(!hasFilter) return d.coords||[];
    return (d.coords||[]).filter(c=>{
      if(fOwner!=="all"&&c.sowner!==fOwner) return false;
      if(fReg!=="all") return false; // coords don't have reg, skip
